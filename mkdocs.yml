site_name: OpenSkill.Top
site_url: https://openskill.top
site_description: 发现与使用强大的 Agent Skills - 技能聚合导航与 OpenClaw 公开课
site_author: OpenSkill Team

theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: amber
  logo: static/openskill.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Skills: index.md
  - 安装配置:
      - installation/index.md
      - 更安全地部署OpenClaw：我的容器化隔离实践: installation/bwp-2026-03-25-openclaw-v1.1.md
      - 在OpenClaw容器中部署Claude Code（上）：从零开始搭建你的AI开发助手: installation/bwp-2026-03-26-openclawclaude-code-v1.8.md
  - 技能实践:
      - skill-practice/index.md
  - 技能分享:
      - skill-sharing/index.md
      - QAgent:把"自然语言"变成企业办公新操作系统的智能体助手: skill-sharing/qagent-introduction.md
      - 基于Claude的可自我进化AI智能体：Warp的规模化落地实践: skill-sharing/xk-2026-08-28-warp-self-evolving-agent-v1.0.md
  - 应用案例:
      - use-cases/index.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
